<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Job Application Tracker</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <div>
        <p class="eyebrow">Portfolio project</p>

        <h1>Job Application Tracker</h1>

        <p class="subtitle">
            Keep opportunities organized from saved role to offer.
        </p>
    </div>

    <button id="new-button" class="primary">
        + Add application
    </button>
</header>

<main>

    <section class="metrics" aria-label="Application summary">

        <article>
            <span id="total-count">0</span>
            <small>Total</small>
        </article>

        <article>
            <span id="interview-count">0</span>
            <small>Interviews</small>
        </article>

        <article>
            <span id="offer-count">0</span>
            <small>Offers</small>
        </article>

    </section>

    <section class="toolbar">

        <div class="search-group">
            <label for="search-input">
                Search applications
            </label>

            <input
                    id="search-input"
                    type="search"
                    placeholder="Search by company or role..."
                    autocomplete="off"
            >
        </div>

        <div class="filter-group">
            <label for="status-filter">
                Filter by status
            </label>

            <select id="status-filter">
                <option value="">All applications</option>
                <option>SAVED</option>
                <option>APPLIED</option>
                <option>INTERVIEW</option>
                <option>OFFER</option>
                <option>REJECTED</option>
            </select>
        </div>

    </section>

    <div
            id="message"
            role="status"
            aria-live="polite">
    </div>

    <section
            id="application-list"
            class="application-list">
    </section>

</main>

<dialog id="application-dialog">

    <form id="application-form">

        <div class="dialog-heading">

            <h2 id="dialog-title">
                Add application
            </h2>

            <button
                    type="button"
                    id="close-button"
                    class="icon"
                    aria-label="Close">
                &times;
            </button>

        </div>

        <input
                type="hidden"
                id="application-id">

        <label>
            Company

            <input
                    id="company"
                    maxlength="100"
                    required>
        </label>

        <label>
            Role

            <input
                    id="role"
                    maxlength="100"
                    required>
        </label>

        <div class="form-row">

            <label>
                Status

                <select id="status" required>
                    <option>SAVED</option>
                    <option>APPLIED</option>
                    <option>INTERVIEW</option>
                    <option>OFFER</option>
                    <option>REJECTED</option>
                </select>

            </label>

            <label>
                Date

                <input
                        id="applied-date"
                        type="date"
                        required>
            </label>

        </div>

        <label>
            Notes

            <textarea
                    id="notes"
                    maxlength="500"
                    rows="4">
            </textarea>
        </label>

        <div class="actions">

            <button
                    type="button"
                    id="cancel-button"
                    class="secondary">
                Cancel
            </button>

            <button class="primary">
                Save application
            </button>

        </div>

    </form>

</dialog>

<script src="app.js"></script>

</body>
</html>
